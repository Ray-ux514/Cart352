<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canadian Job Market</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="homepage">
      <div class="content">
        <p class="subtitle">AN INTERACTIVE DATA EXPERIENCE</p>

        <h1>THE FUTURE<br />OF WORK</h1>

        <p class="description">
          Explore Canada's evolving job market. Discover how employment
          opportunities, competition, and artificial intelligence are shaping
          the future of work.
        </p>

        <label for="occupation">Choose an occupation</label>

        <select id="occupation">
          <option value="">Select an occupation</option>
          <option value="graphic-designer">Graphic Designer</option>
          <option value="software-developer">Software Developer</option>
          <option value="nurse">Nurse</option>
          <option value="teacher">Teacher</option>
          <option value="electrician">Electrician</option>
        </select>

        <button id="startButton">START EXPLORING →</button>

        <p id="message"></p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
